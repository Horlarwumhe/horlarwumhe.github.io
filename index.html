<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Promoshoper</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a237e, #0d47a1);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            animation: fadeIn 1.5s ease-in;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
        }

        .divider {
            width: 60%;
            height: 3px;
            background: #fff;
            margin: 2rem auto;
            border-radius: 2px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 3rem 0;
        }

        .time-unit {
            background: rgba(255,255,255,0.1);
            padding: 1.5rem;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .number {
            font-size: 2.5rem;
            font-weight: bold;
            display: block;
        }

        .label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .subscribe {
            margin-top: 3rem;
        }

        input[type="email"] {
            padding: 1rem;
            border: none;
            border-radius: 25px;
            width: 300px;
            margin-right: 1rem;
            font-size: 1rem;
            background: rgba(255,255,255,0.9);
        }

        button {
            padding: 1rem 2rem;
            border: none;
            border-radius: 25px;
            background: #00e676;
            color: #1a237e;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            background: #69f0ae;
        }

        .social-icons {
            margin-top: 3rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .social-icons a {
            color: #fff;
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }

        .social-icons a:hover {
            transform: translateY(-5px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .countdown { flex-direction: column; }
            input[type="email"] { width: 100%; margin-bottom: 1rem; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Coming Soon!</h1>
        <div class="divider"></div>
        <p>We're working hard to bring you something amazing. Stay tuned!</p>
        
        <div class="countdown">
            <div class="time-unit">
                <span class="number" id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-unit">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-unit">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-unit">
                <span class="number" id="seconds">00</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <div class="subscribe">
            <input type="email" placeholder="Enter your email for updates">
            <button>Notify Me!</button>
        </div>

        <div class="social-icons">
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-linkedin"></i></a>
        </div>
    </div>

    <script>
        // Updated Countdown Timer with validation
        const countDownDate = new Date("Mar 1, 2025 00:00:00").getTime();
        const countdownElement = document.querySelector('.countdown');
    
        const timer = setInterval(function() {
            const now = new Date().getTime();
            let distance = countDownDate - now;
    
            // Prevent negative values
            if (distance < 0) {
                clearInterval(timer);
                countdownElement.innerHTML = '<div class="launch-message">Website Launched! 🚀</div>';
                return;
            }
    
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
    
            // Update display
            document.getElementById("days").textContent = days.toString().padStart(2, '0');
            document.getElementById("hours").textContent = hours.toString().padStart(2, '0');
            document.getElementById("minutes").textContent = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").textContent = seconds.toString().padStart(2, '0');
    
        }, 1000);
    
        // Immediate check on page load
        const initialCheck = () => {
            const now = new Date().getTime();
            let distance = countDownDate - now;
            
            if (distance < 0) {
                clearInterval(timer);
                countdownElement.innerHTML = '<div class="launch-message">Website Launched! 🚀</div>';
            }
        }
        initialCheck();
    </script>
</body>
</html>
